apply plugin: 'com.android.library'

android {
    namespace 'com.team.ijkplayer'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    api(name: 'ijkplayer-java-0.8.2', ext: 'aar')
    implementation(name: 'ijkplayer-armv7a-0.8.2', ext: 'aar')
    implementation(name: 'ijkplayer-x86-0.8.2', ext: 'aar')
    implementation(name: 'ijkplayer-exo-0.8.2', ext: 'aar')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.5.1', {
        exclude group: 'androidx.annotation', module: 'support-annotations'
    })
    implementation "com.android.support.constraint:constraint-layout:$constraintlayout_version"
    implementation "com.android.support:appcompat-v7:$android_support_version"
    implementation "com.android.support:preference-v7:$android_support_version"
    implementation "com.android.support:support-annotations:$android_support_version"
    implementation 'com.squareup:otto:1.3.8'
    testImplementation 'junit:junit:4.13.2'
}
